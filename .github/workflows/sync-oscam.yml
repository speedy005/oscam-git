name: Sync OSCam with Streamboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-oscam-master
  cancel-in-progress: false

jobs:
  sync:
    name: Update master from Streamboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout GitHub fork
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://git.streamboard.tv/common/oscam.git
          git fetch --no-tags upstream master
          git fetch --no-tags origin master

      - name: Synchronize with Streamboard and preserve workflows
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git checkout master

          # Back up all GitHub Actions workflow files.
          BACKUP_DIR="$(mktemp -d)"
          trap 'rm -rf "$BACKUP_DIR"' EXIT

          if [ -d .github/workflows ]; then
            cp -a .github/workflows "$BACKUP_DIR/workflows"
          fi

          # Remember the current upstream commit.
          UPSTREAM_COMMIT="$(git rev-parse upstream/master)"
          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"

          echo "Streamboard commit: $UPSTREAM_COMMIT"

          # Reset master to the exact upstream commit.
          git reset --hard "$UPSTREAM_COMMIT"

          # Restore our own workflow files.
          if [ -d "$BACKUP_DIR/workflows" ]; then
            mkdir -p .github/workflows
            cp -a "$BACKUP_DIR/workflows/." .github/workflows/
          fi

          # Stage only the workflow directory.
          git add -A -- .github/workflows

          # Commit only if workflow files differ from upstream.
          if ! git diff --cached --quiet; then
            git commit -m "Preserve GitHub Actions workflows"
          fi

          echo "Local commit: $(git rev-parse HEAD)"

      - name: Push updates to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin master

      - name: Verify synchronization
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin master

          LOCAL_COMMIT="$(git rev-parse origin/master)"

          echo "GitHub commit: $LOCAL_COMMIT"
          echo "Streamboard:   $UPSTREAM_COMMIT"

          # Verify that everything outside .github/workflows matches upstream.
          git diff --exit-code \
            "$UPSTREAM_COMMIT" origin/master \
            -- . ':(exclude).github/workflows'

          # Ensure the workflow directory exists on GitHub.
          git cat-file -e origin/master:.github/workflows

          echo "Synchronization verified successfully."

      - name: Create issue on synchronization failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="[OSCam Sync] Upstream synchronization failed"

          BODY=$(cat <<EOF
          Die automatische Synchronisierung von Streamboard ist fehlgeschlagen.

          **Upstream:** https://git.streamboard.tv/common/oscam
          **Fork:** https://github.com/${GH_REPO}
          **Branch:** master

          Mögliche Ursachen:
          - Streamboard nicht erreichbar
          - Push- oder Berechtigungsfehler
          - Branch-Schutzregeln verhindern das Aktualisieren
          - Fehler beim Wiederherstellen der Workflow-Dateien
          - Fehler bei der Überprüfung der Synchronisierung

          [Workflow-Ausführung und Fehlerprotokoll ansehen](${RUN_URL})

          Bitte prüfe die Logs und starte den Workflow nach Behebung des Fehlers erneut.
          EOF
          )

          # Create the label if it does not exist.
          gh label create sync-error \
            --repo "$GH_REPO" \
            --color "d73a4a" \
            --description "Automatic OSCam synchronization errors" \
            2>/dev/null || true

          EXISTING_ISSUE="$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --label "sync-error" \
            --json number,title \
            --jq '.[] | select(.title == "[OSCam Sync] Upstream synchronization failed") | .number' \
            | head -n 1 || true)"

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" \
              --repo "$GH_REPO" \
              --body "$BODY"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$TITLE" \
              --label "sync-error" \
              --body "$BODY"
          fi
