name: Sync OSCam with Streamboard

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-oscam-master
  cancel-in-progress: false

jobs:
  sync:
    name: Update master from Streamboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://git.streamboard.tv/common/oscam.git
          git fetch --no-tags upstream master
          git fetch --no-tags origin master
          git fetch --no-tags origin github-workflows || true

      - name: Preserve workflows in separate branch
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the existing workflow branch.
          if git show-ref --verify --quiet refs/remotes/origin/github-workflows; then
            git checkout -B github-workflows origin/github-workflows
          else
            # On the first run, copy workflows from the current master.
            git checkout -B github-workflows origin/master
          fi

          # Ensure the workflow directory exists before attempting to save it.
          if [ ! -d .github/workflows ]; then
            echo "::error::No .github/workflows directory found to preserve."
            exit 1
          fi

          git add -A -- .github/workflows

          if ! git diff --cached --quiet; then
            git commit -m "Preserve GitHub Actions workflows"
          fi

          git push --force origin github-workflows

      - name: Synchronize master exactly with Streamboard
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(git rev-parse upstream/master)"

          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "Streamboard commit: $UPSTREAM_COMMIT"

          # Point master directly to the upstream commit.
          git checkout -B master "$UPSTREAM_COMMIT"

          # No additional workflow commit is created on master.
          git push --force origin master

      - name: Verify synchronization
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin master
          git fetch --no-tags upstream master

          LOCAL_COMMIT="$(git rev-parse origin/master)"
          UPSTREAM_COMMIT="$(git rev-parse upstream/master)"

          echo "GitHub master: $LOCAL_COMMIT"
          echo "Streamboard:   $UPSTREAM_COMMIT"

          if [ "$LOCAL_COMMIT" != "$UPSTREAM_COMMIT" ]; then
            echo "::error::GitHub master is not identical to Streamboard master."
            exit 1
          fi

          echo "Synchronization verified successfully."

      - name: Create issue on synchronization failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="[OSCam Sync] Upstream synchronization failed"

          BODY=$(cat <<EOF
          Die automatische Synchronisierung von Streamboard ist fehlgeschlagen.

          **Upstream:** https://git.streamboard.tv/common/oscam
          **Fork:** https://github.com/${GH_REPO}
          **Branch:** master
          **Workflow-Branch:** github-workflows

          Mögliche Ursachen:
          - Streamboard nicht erreichbar
          - Push- oder Berechtigungsfehler
          - Branch-Schutzregeln verhindern das Aktualisieren
          - Workflow-Dateien konnten nicht gesichert werden
          - Die Commit-Prüfung ist fehlgeschlagen

          [Workflow-Ausführung und Fehlerprotokoll ansehen](${RUN_URL})

          Bitte prüfe die Logs und starte den Workflow nach Behebung des Fehlers erneut.
          EOF
          )

          gh label create sync-error \
            --repo "$GH_REPO" \
            --color "d73a4a" \
            --description "Automatic OSCam synchronization errors" \
            2>/dev/null || true

          EXISTING_ISSUE="$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --label "sync-error" \
            --json number,title \
            --jq '.[] | select(.title == "[OSCam Sync] Upstream synchronization failed") | .number' \
            | head -n 1 || true)"

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" \
              --repo "$GH_REPO" \
              --body "$BODY"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$TITLE" \
              --label "sync-error" \
              --body "$BODY"
          fi
